name: ${name}
version: ${version}
main: cn.lunadeer.dominion.bedrockui.DominionBedrockUI
api-version: '1.20'
folia-supported: true
description: Bedrock (Geyser/floodgate) form GUI extension for the Dominion plugin.
author: Applecraftdev
depend: [ Dominion ]
softdepend: [ floodgate ]
commands:
  dbui:
    description: Open the Dominion Bedrock form UI (Bedrock players) or forward to the original Dominion UI (Java players).
    usage: /dbui
    aliases: [ dominionbedrock, bedrockui ]
permissions:
  dominionbedrockui.use:
    description: Allows using the Dominion Bedrock UI extension command.
    default: true
